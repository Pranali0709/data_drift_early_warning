apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-drift-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-drift
  template:
    metadata:
      labels:
        app: data-drift
    spec:
      containers:
        - name: data-drift
          image: data-drift-warning:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8501

---
apiVersion: v1
kind: Service
metadata:
  name: data-drift-service
spec:
  type: NodePort
  selector:
    app: data-drift
  ports:
    - port: 8501
      targetPort: 8501